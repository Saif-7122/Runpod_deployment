# Content Engine v1.2 configuration.  NO API KEYS HERE -> they live in .env (see .env.example).

# Root for catalog/, cache/, runs/.  Relative = inside the repo. On RunPod set CE_WORKSPACE=/workspace/data
workspace: "./workspace"

drive:
  raw_folder_id: "12sr-Z52Cc50QifU3-3qfDQpXAt4DevNi"   # (single-folder fallback)
  raw_folder_ids:                                       # every footage source analysed for the catalog
    - "12sr-Z52Cc50QifU3-3qfDQpXAt4DevNi"               # Footage (full library)
    - "1cn-nlMKwUUdKk8qqd4eHejyLSEcQ6fVF"               # OXYGEN FOREST CLIENT (Oct 2026 shoot)
  output_folder_id: "1KdYODMCEXcg6kNWN8WC2ltpYT-zOxLDO"         # finished videos + captions are uploaded here (old: 1aLI-xTyuZqMG1uDX51Axkhhjz0oVZiFj)
  upload_by_default: false
  dated_subfolder: false        # true = OUTPUT/<date>/...; false = straight into the OUTPUT folder

models:
  vision_model: "claude-haiku-5-5"      # clip review (once per clip) and draft-video viewer check
  director_model: "claude-sonnet-5-5"   # writes 5 candidate plans per call (the only real Claude spend)
  judge_model: "claude-haiku-5-5"       # ranks the 5 candidates in one cheap call
  max_tokens: 64000             # ceiling for thinking + answer (streamed; billed only for what is used)
  effort:                       # thinking depth per task: low | medium | high | xhigh | max
    director_model: medium      # creative quality vs cost sweet spot
    judge_model: low            # scoring against a written rubric
    vision_model: low

analysis:
  workers: 3                    # clips analysed in parallel
  vision_provider: claude       # claude = Haiku (~$0.005 per clip, once); local = Qwen2.5-VL (not used)
  vision_frame_width: 640       # px width of frames shown to the vision model
  max_vision_frames: 20         # long clips are sampled evenly down to this
  min_ad_score: 6               # Claude score (0-10) needed to approve a segment
  min_short_side_px: 1080       # below this the clip is flagged low_resolution
  make_proxies: true            # 1080-wide proxy per clip -> much faster renders
  keep_frames: false            # true = keep extracted frames for review (uses disk)
  keep_originals: true          # renders use the full-quality original (false = delete it to save disk)
  footage_guidance: >-
    This library is mostly authentic site-visit and lifestyle footage (handheld/gimbal walks, guides with
    visitors, planting, farm life, rustic huts, paths, plantations) plus some aerial/landscape shots.
    For our Meta lead-ad Reels, real people and real moments are VALUABLE: visitors walking a path, a guide
    pointing, hands planting, a family feeding cows, a couple under the pergola. People seen from behind are
    fine when the moment reads. Score for usefulness in an authentic, warm 9:16 ad: 8-10 = beautiful or
    emotionally strong, 6-7 = clean and usable, 4-5 = usable only as filler, 0-3 = broken.
    Reject only when the shot is visually broken: badly obstructed (post/trunk/head blocking the subject),
    nothing readable in frame, ugly clutter as the main subject, awkward moments (mid-blink, picking nose,
    looking lost), vehicles/number plates as the subject, or a visible lavalier mic in close-up.
  blocking_problems:            # Claude problems that reject a segment
    - competitor_branding
    - construction_mess
    - watermark
    - text_on_screen          # burned-in captions / titles from an earlier edit
    - letterboxed_or_framed   # black bars, rounded frames, picture-in-picture

audio:                          # clips that already carry meaningful speech (edited videos, testimonials)
  enabled: true
  stt: sarvam                   # sarvam (English + Telugu); whisper = local (not used)
  stt_url: "https://api.sarvam.ai/speech-to-text"
  stt_model: "saaras:v3"        # verified 2026-10-23
  silence_db: -40               # below = silence when splitting speech into phrases
  min_gap_s: 0.3
  max_stt_chunk_s: 25           # Sarvam REST accepts < 30 s per request
  max_stt_requests_per_clip: 12
  min_words: 6                  # fewer words = treat as music / ambient (audio ignored)
  min_native_s: 2.0
  max_native_s: 15.0

thresholds_clip:                # stage B technical checks; tune on 20-30 of your clips
  sharp_rel: 0.30               # blurry if sharpness < 30% of the clip's median ...
  sharp_abs: 15                 # ... or below this absolute floor
  dark_mean: 35                 # mean luma below this = too dark
  clipped_frac: 0.15            # >15% pixels at 250+ = blown out (bright skies are normal)
  whip_speed: 0.12              # frame-widths moved per 0.25 s = whip-pan
  shake_jerk: 0.022             # 1 s median jitter; ~90th percentile of the client footage (2026-10-24)
  cut_hist_correl: 0.55         # colour-histogram correlation below this = new shot ...
  cut_track_response: 0.08      # ... or motion tracking lost (low confidence)
  cut_frame_diff: 25            #     while the whole frame changed (mean abs diff, 0-255)
  edge_trim_s: 0.5              # drop first/last 0.5 s of every recording
  min_segment_s: 1.5
  max_segment_s: 10

local_models:                   # free models on the RunPod GPU (see LICENSES.md)
  vlm: "Qwen/Qwen2.5-VL-7B-Instruct"
  whisper: "large-v3"

video_judge:                    # judges a quick 540x960 draft before the final render (free, local)
  drafts: 2                     # top-ranked scripts that get a draft
  use_vlm: true
  viewer: claude                # claude (Haiku, ~$0.001 per draft) | local
  duration_s: [30, 40]
  min_hook_motion: 2.0          # mean frame change in the first 2 s (0-255 scale)
  max_speech_start_s: 0.6
  max_dead_s: 1.0               # longest frozen / black stretch
  cuts_per_10s: [2.5, 6.5]
  target_lufs: -14
  min: {hook: 7, match: 7, overall: 7}   # viewer scores (0-10) from the local vision model

director:
  candidates_per_call: 5        # one Sonnet call writes 5 versions; the judge keeps the best
  default_style: weekend_home   # styles/<name>.yaml
  default_target_seconds: 35
  temperature: 0.9              # variety between versions; the judge runs at 0
  words_per_second: 2.6         # Indian English voiceover at pace ~1.1
  words_per_second_by_language: {en: 2.6, te: 2.0, hi: 2.5}   # Telugu words are longer; recalibrate from real voiceovers
  max_scene_seconds: 3.5        # longest single cut
  min_scene_seconds: 1.2        # shortest single cut (style: "no shot shorter than 1.2 s")
  first_cut_by_seconds: 2.5     # style hook rule: first cut lands by 2.0-2.5 s
  max_segments_in_prompt: 120
  max_native_per_video: 1       # clips played with their own audio (testimonial / presenter)

judge:
  max_attempts: 2               # 1 batch of 5 + one retry batch; then dropped (never rendered)
  length_tolerance: 0.15
  gate:                         # a plan is produced only if EVERY minimum is met
    min: {hook: 8, storyboard: 7, content: 7, cta: 7}
    weights: {hook: 3, storyboard: 2.5, content: 2.5, cta: 2}
    min_total: 78               # weighted score out of 100

tts:
  provider: "elevenlabs"        # elevenlabs (Oct 2026 organic batch) | sarvam (bulbul:v3, English + Telugu)
  elevenlabs:                   # one request per script (/with-timestamps) so sentences flow; key in .env ELEVENLABS_API_KEY
    url: "https://api.elevenlabs.io/v1/text-to-speech/{voice_id}/with-timestamps"
    model: "eleven_v4"          # Telugu + English; eleven_v4_turbo costs half the credits
    output_format: "mp3_44100_128"   # 192 kbps needs the Creator tier
    voice_settings: {stability: 0.45, similarity_boost: 0.8, style: 0.2, use_speaker_boost: true, speed: 1.0}
    voices:                     # ElevenLabs voice library ids (chosen by the user)
      professor_bill: "lnieQLGTodpbhjpZtg1k"   # en, calm American male
      tessa: "kw7MsfzXoT4yQD1Lgo5A"            # en, pleasant American female
      bunty: "2I56yvR6ubAyIbBlNfn7"            # Indian male explainer (Hindi-native)
      kalpana: "llsUsrN3CKAHdUcqg2c6"          # Indian-English female creator
      chaitra: "PnktIx9i1QQBGfm7h7cd"          # te, calm female narrator
      chaitra_lively: "oyjIr5XAhIyRjfNq6spl"   # te, upbeat female
      maddy: "byBvnAtc0165IHbm4c7a"            # te, warm male narrator
      anusha: "t1csE7x0GR94Z0Nvb8oa"           # te, friendly female (user pick, 2026-10-31)
      en_main: "ack0QsRaQyDLnVyMQTSd"          # en, the user's chosen English voice (2026-10-31)
    defaults: {en: en_main, te: maddy, hi: bunty}
  url: "https://api.sarvam.ai/text-to-speech"
  model: "bulbul:v3"            # verified 2026-10-23 (v1, v2 retired)
  speaker: "priya"              # bulbul:v3 voices: priya, kavya, ritu, shubh, advait, ... (samples in workspace/voice_samples)
  request_style: "text"         # "inputs" for the old bulbul:v1 API shape
  language_code: "en-IN"
  pace: 1.1                     # a little faster than default, still natural
  pitch_semitones: 0.8          # slightly higher = sweeter; applied after Sarvam, does not change speed
  languages:                    # per-language overrides
    en: {language_code: "en-IN"}
    te: {language_code: "te-IN"}
    hi: {language_code: "hi-IN"}
  sample_rate: 22050
  parallel_requests: 4
  gap_seconds: 0.15
  silence_db: -45

captions:
  # Typography spec (professional Reels practice + Meta safe zones), brand fonts/colours from oxygenforest.io.
  # One palette for the whole video. Fonts ship in ./fonts (SIL Open Font License).
  fonts_dir: "fonts"
  safe_zone: {top: 0.14, bottom: 0.35, sides: 0.06}   # keep ALL text out of these bands (Meta Reels UI)
  palette:                      # hex RGB
    text: "#FBFAF6"             # warm white
    accent: "#E4B7A9"           # blush: the word being spoken
    shadow: "#1C1B15"           # ink: soft shadow / outline
    panel: "#7A1A17"            # maroon: CTA panel and headline rule
    deep: "#1A241B"             # deep forest green
  caption:                      # spoken-word captions, word-by-word highlight
    font: "Poppins SemiBold"
    size: 78                    # px on a 1080x1920 frame (readable on a phone)
    max_chars_per_line: 22
    max_words: 4                # words on screen at once
    min_seconds: 0.6
    y_center: 1180              # px from top: just above the bottom 35% UI band
    outline: 4
    shadow: 3
  headline:                     # overlay headline (2-5 words), editorial serif
    font: "Fraunces SemiBold"
    size: 86
    y_top: 300                  # px from top: just under the top 14% UI band
    outline: 0
    shadow: 5
  languages:                    # font overrides per script language
    te:
      caption: {font: "Noto Sans Telugu SemiBold", size: 70}
      headline: {font: "Noto Sans Telugu", size: 78}
    hi:                         # Poppins has Devanagari; Fraunces does not
      caption: {font: "Poppins SemiBold", size: 72}
      headline: {font: "Poppins SemiBold", size: 76}
  end_card:                     # brand + CTA, last seconds of the CTA line
    brand: "Oxygen Forest"
    font: "Marcellus"           # brand display face (HOI Brand Guidelines v2.0)
    sub: "Pranavayu Vanam · Kamareddy"
    contact: "+91 81217 77770"  # CTA is "contact us right now" (user, 2026-10-30), so show the number
    seconds: 3.0
  wordmark: {text: "", font: "Fraunces SemiBold", size: 44}   # text mark, top left (off: the logo below is the brand mark)
  # red Oxygen Forest logo, fixed top right on every frame (1080-wide coordinates). Sits exactly over the logo that is
  # burned into the site-visit clips, so those never show it twice.
  headlines: false              # no top heading text when burned captions are on (user, 2026-10-30)
  logo: {path: "assets/of_logo_red.png", x: 922, y: 70, width: 118,      # smaller (user, 2026-10-30)
         branded_projects: ["Oxygen Forest Client Site Visits"]}   # these clips already carry the logo
  # Type themes, picked per reel (plan "theme"). *Stressed words* in a script use the emph font/colour/scale.
  themes:
    forest_serif: {caption: {font: "Poppins SemiBold"}, headline: {font: "Fraunces SemiBold", size: 92},
                   emph: {font: "Fraunces SemiBold Italic", color: "#E4B7A9", scale: 1.3}}
    bold_anton:   {caption: {font: "Poppins Bold"}, headline: {font: "Anton", size: 112},
                   emph: {font: "Anton", color: "#F2C14E", scale: 1.4}}
    bebas_leaf:   {caption: {font: "Poppins SemiBold"}, headline: {font: "Bebas Neue", size: 130},
                   emph: {font: "Bebas Neue", color: "#A8E063", scale: 1.5}}
    archivo:      {caption: {font: "Poppins SemiBold"}, headline: {font: "Archivo Black", size: 84},
                   emph: {font: "Archivo Black", color: "#FF9F43", scale: 1.25}}
    editorial:    {caption: {font: "Poppins Medium"}, headline: {font: "DM Serif Display", size: 100},
                   emph: {font: "DM Serif Display", color: "#F6E7C1", scale: 1.4}}
    elegant:      {caption: {font: "Poppins SemiBold"}, headline: {font: "Marcellus", size: 92},
                   emph: {font: "Marcellus", color: "#F2C14E", scale: 1.45}}
    abril:        {caption: {font: "Poppins SemiBold"}, headline: {font: "Abril Fatface", size: 96},
                   emph: {font: "Abril Fatface", color: "#E4B7A9", scale: 1.35}}
    # reference-reel look (user's Drive references, 2026-10-30): one calm phrase at mid-frame, no colour highlight,
    # the stressed word switches to a serif; soft shadow, no heavy outline
    ref_en:       {phrase: true, caption: {font: "Poppins Medium", size: 74, max_words: 5, max_chars_per_line: 26,
                                           y_center: 1000, outline: 1, shadow: 4},
                   emph: {font: "Fraunces SemiBold Italic", color: "#FFFFFF", scale: 1.3}}
    # House of Investors brand type (Brand Guidelines v2.0): Marcellus display + Instrument Sans text; Telugu:
    # Noto Serif Telugu display + Noto Sans Telugu text. Colour is free to experiment; fonts are not.
    hoi_en:       {phrase: true, caption: {font: "Instrument Sans SemiBold", size: 72, max_words: 5, max_chars_per_line: 26,
                                           y_center: 1000, outline: 1, shadow: 4},
                   emph: {font: "Marcellus", color: "#E3C98F", scale: 1.32}}
    hoi_te:       {phrase: true, caption: {font: "Noto Sans Telugu SemiBold", size: 90, max_words: 4, max_chars_per_line: 24,
                                           y_center: 1000, outline: 1, shadow: 4},
                   emph: {font: "Noto Serif Telugu Bold", color: "#E3C98F", scale: 1.15}}
    ref_te:       {phrase: true, caption: {font: "Hind Guntur SemiBold", size: 92, max_words: 4, max_chars_per_line: 24,
                                           y_center: 1000, outline: 0, shadow: 3},
                   emph: {font: "Ramabhadra", color: "#FFFFFF", scale: 1.15}}
    te_ramabhadra: {caption: {font: "Hind Guntur SemiBold", size: 112}, headline: {font: "Ramabhadra", size: 172},
                    emph: {font: "Ramabhadra", color: "#F2C14E", scale: 1.3}}
    te_ntr:        {caption: {font: "Hind Guntur SemiBold", size: 112}, headline: {font: "Hind Guntur Bold", size: 160},
                    emph: {font: "Hind Guntur Bold", color: "#A8E063", scale: 1.35}}
    te_tiro:       {caption: {font: "Noto Sans Telugu SemiBold", size: 104}, headline: {font: "Ramabhadra", size: 172},
                    emph: {font: "Ramabhadra", color: "#FF9F43", scale: 1.3}}
    te_suranna:    {caption: {font: "Hind Guntur SemiBold", size: 112}, headline: {font: "Suranna", size: 172},
                    emph: {font: "Hind Guntur Bold", color: "#E4B7A9", scale: 1.3}}

rendering:
  hook_push_in: true            # slow zoom on the first shot
  transition_seconds: 0.3       # soft dissolve between shots; hard jump cuts felt abrupt (user, 2026-10-30)
  grade: "eq=contrast=1.06:saturation=1.10:gamma=0.98,colorbalance=rm=0.02:bm=-0.02,noise=alls=3:allf=t"   # one warm look + light grain
  video_codec: "libx264"        # "h264_nvenc" on the RunPod 4090 (setup.sh sets this via CE_CODEC)
  nvenc_preset: "p5"
  cq: 19                        # NVENC quality (lower = better)
  crf: 18                       # x264 quality
  x264_preset: "medium"
  maxrate: "16M"                # high enough that foliage and drone detail survive Meta's re-encode
  sharpen: true                 # mild unsharp after lanczos downscale
  fps: 30
  hw_decode: false              # true on the pod (originals are 4K/2.7K)
  prefer_originals: true        # render from full-quality originals; proxies only as a fallback
  parallel_renders: 4           # simultaneous NVENC encodes on the 4090
  threads: 4                    # CPU threads per render
  tail_seconds: 1.5             # picture held after the last word (end card breathes)
  music_path: ""                # optional background track (ducked under the voice)
  music_volume: 0.15

batch:
  parallel_videos: 10           # videos in flight: Claude/Sarvam calls overlap with GPU renders (50/hour target)
  max_claude_usd: 6.0           # hard stop for a batch's Claude spend (~$0.06/video incl. clip review)

pricing:                        # $ per million tokens [input, output, cache read, cache write]; check anthropic.com/pricing
  claude-sonnet-5-5: [2.0, 10.0, 0.20, 2.5]
  claude-haiku-5-5: [0.10, 0.50, 0.01, 0.125]
  claude-opus-5-5: [4.0, 20.0, 0.20, 5.0]

banned_claims:
  - "100% guaranteed"
  - "guaranteed returns"
  - "risk-free"
  - "instant riches"
  - "get rich quick"
  - "zero risk"
  - "guaranteed profit"
  - "government approved returns"
  - "100% safe investment"
  - "double your money"
  - "effortless wealth"
  - "no risk involved"
