<style>
:root{--navy:#0b1a36;--navy2:#10244a;--gold:#c9a96b;--cream:#f4efe4;--mute:#9aa6bd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--navy);overflow:hidden;font-family:Poppins,sans-serif;font-variant-numeric:lining-nums}
.ad{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--navy)}
.abs{position:absolute}
.logo{width:150px}
.hl{font-family:'Cormorant Garamond',serif;font-weight:600;color:#fff;line-height:1;letter-spacing:.005em}
.row{display:flex}
.f{flex:1;display:flex;align-items:center;gap:14px;padding:0 22px;border-left:1px solid rgba(201,169,107,.45)}
.f:first-child{border-left:0;padding-left:0}
.f svg{flex:none;width:40px;height:40px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f small{display:block;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:500;margin-bottom:3px}
.f b{display:block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:35px;line-height:1.02;white-space:nowrap;color:#fff}
.cta{display:flex;align-items:center;justify-content:space-between}
.ph{display:flex;align-items:center;gap:12px;color:#fff;font-weight:500;font-size:27px;letter-spacing:.03em}
.ph svg{width:28px;height:28px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.btn{background:var(--gold);color:var(--navy);font-weight:600;font-size:23px;letter-spacing:.06em;padding:15px 44px;border-radius:40px}
.fn{font-size:12px;color:var(--mute);letter-spacing:.02em}

.card{left:40px;top:40px;width:1000px;height:640px;border-radius:20px;background:url(hC.jpg) 50% 45%/cover no-repeat;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,36,.55),rgba(7,16,36,0) 40%)}
.logo{left:76px;top:72px;width:120px;z-index:2}
.hl{left:64px;top:708px;font-size:74px}
.hl i{color:var(--gold);font-style:normal}
.bot{left:64px;right:64px;top:752px}
.bot .cta{margin-top:26px;padding-top:24px;border-top:1px solid rgba(201,169,107,.35)}
.bot .fn{margin-top:16px}
