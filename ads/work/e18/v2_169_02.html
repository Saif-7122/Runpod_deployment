<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#2d5a3d;--deep:#0f281a;--mint:#c4e6cd;--cream:#eef5ee}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:var(--deep);overflow:hidden;font-family:'DM Sans',sans-serif;font-variant-numeric:lining-nums}
.ad{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--deep)}
.abs{position:absolute}
.ph{background-repeat:no-repeat;background-size:cover}
.hl{font-family:Marcellus,serif;color:#fff;line-height:1.04;text-shadow:0 2px 24px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.55)}
.sub{font-size:30px;font-weight:500;color:#fff;margin-top:14px;text-shadow:0 2px 14px rgba(0,0,0,.75)}
.logo{filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
.glass{background:rgba(14,38,26,.60);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:24px}
.lab{white-space:nowrap;font-size:22px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mint)}
.big{font-weight:500;color:#fff;line-height:1.08}
.btn{background:var(--cream);color:var(--deep);font-weight:700;font-size:32px;padding:20px 50px;border-radius:60px;white-space:nowrap}
.phone{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:38px;white-space:nowrap}
.phone svg{width:36px;height:36px;fill:none;stroke:var(--mint);stroke-width:2.2;stroke-linejoin:round}
.fn{font-size:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.8)}
svg.i{fill:none;stroke:var(--mint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style></head><body><div class="ad">
<div class="abs ph" style="left:300px;top:0;width:980px;height:720px;background-image:url(hero02.jpg);background-position:60% 50%"></div>
<img class="abs logo" style="right:44px;top:34px;width:130px" src="logo_light.png">
<div class="abs glass" style="left:36px;top:36px;width:540px;height:648px;padding:32px 34px;display:flex;flex-direction:column;justify-content:space-between">
  <div><div class="hl" style="font-size:62px">Gather Around the Fire</div><div class="sub" style="font-size:22px;margin-top:10px">Outdoor sunken seating in your own garden</div></div>
  <div>
    <div style="display:flex;align-items:center;gap:16px;padding-bottom:11px"><svg width="34" height="34" class="i" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/><path d="M16 14h16M16 20h16M16 14c8 0 10 4 6 8-2 2-5 3-8 3l10 11"/></svg><div><div class="lab" style="font-size:18px">Starting from</div><div class="big" style="font-size:30px;margin-top:3px">₹3.5 Cr*</div></div></div>
    <div style="display:flex;align-items:center;gap:16px;padding:11px 0;border-top:1px solid rgba(196,230,205,.4)"><svg width="34" height="34" class="i" viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32"/><path d="M8 18h7M8 26h4M8 34h7M30 40v-6M22 40v-4"/></svg><div><div class="lab" style="font-size:18px">Plot size</div><div class="big" style="font-size:30px;margin-top:3px">682–1,246 Sq. Yd</div></div></div>
    <div style="display:flex;align-items:center;gap:16px;padding:11px 0;border-top:1px solid rgba(196,230,205,.4)"><svg width="34" height="34" class="i" viewBox="0 0 48 48"><path d="M24 43S9 29 9 19a15 15 0 0 1 30 0c0 10-15 24-15 24z"/><circle cx="24" cy="19" r="5"/></svg><div><div class="lab" style="font-size:18px">Location</div><div class="big" style="font-size:30px;margin-top:3px">Near Chilkur, Hyderabad</div></div></div>

  </div>
</div></div></body></html>
