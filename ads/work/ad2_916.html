<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0d2a1e;--gold:#d8b46a;--cream:#f4efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:var(--g);overflow:hidden;font-family:Poppins,sans-serif;color:var(--cream)}
.ad{position:relative;width:1080px;background:var(--g);overflow:hidden}
.hero{position:absolute;left:0;width:1080px;background:url(hero.png) center/100% 100% no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--g) 0%,rgba(13,42,30,.55) 16%,rgba(13,42,30,0) 38%,rgba(13,42,30,0) 70%,var(--g) 100%)}
.abs{position:absolute}
.logo{left:65px;width:300px}
.qr{right:65px;width:104px;height:104px;border:1.5px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.14em;color:var(--gold);text-align:center;line-height:1.3}
.rera{right:65px;width:300px;text-align:right;font-size:15px;line-height:1.45;letter-spacing:.03em;color:var(--cream)}
.rera b{color:var(--gold);font-weight:500}
.h{left:65px;font-family:'Cormorant Garamond',serif;font-weight:600;color:#fff;font-size:92px;line-height:1;letter-spacing:.005em}
.f{left:65px;font-size:23px;letter-spacing:.07em;color:var(--cream);font-weight:400}
.f i{color:var(--gold);font-style:normal;padding:0 .5em}
.cta{left:65px;display:inline-flex;align-items:center;gap:26px;height:72px;padding:0 40px;border:1.5px solid var(--gold);border-radius:999px;background:rgba(13,42,30,.7)}
.cta b{font-size:26px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#fff}
.cta span{font-size:26px;color:var(--gold);font-weight:500;letter-spacing:.04em}
/* 9:16  safe: y 269-1248, x 65-1015 */
.s916 .ad{height:1920px}
.s916 .hero{top:520px;height:983px}
.s916 .logo{top:288px}.s916 .qr{top:288px}.s916 .rera{top:400px}
.s916 .h{top:492px}.s916 .f{top:612px}.s916 .cta{top:1166px}
/* 4:5 */
.s45 .ad{height:1350px}
.s45 .hero{top:330px;height:983px}
.s45 .logo{top:62px}.s45 .qr{top:62px}.s45 .rera{top:174px}
.s45 .h{top:236px}.s45 .f{top:352px}.s45 .cta{top:1176px}
/* 1:1 */
.s11 .ad{height:1080px}
.s11 .hero{top:0;height:1080px;background-size:cover;background-position:center}
.s11 .hero:after{background:linear-gradient(180deg,var(--g) 0%,rgba(13,42,30,.7) 20%,rgba(13,42,30,0) 38%,rgba(13,42,30,0) 60%,rgba(13,42,30,.9) 84%,var(--g) 100%)}
.s11 .logo{top:46px;width:205px}.s11 .qr{top:50px}.s11 .rera{top:158px}
.s11 .h{top:200px;font-size:80px}.s11 .f{top:872px}.s11 .cta{top:944px}
</style></head>
<body class="s916"><div class="ad">
<div class="hero"></div>
<img class="abs logo" src="logo_light.png">
<div class="abs qr">RERA<br>QR</div>
<div class="abs rera"><b>RERA No.</b> — to be added<br>rera.telangana.gov.in</div>
<div class="abs h">Solitude Living</div>
<div class="abs f">19 Villa Plots<i>·</i>682–1,246 Sq. Yd<i>·</i>Yelkaguda, Moinabad</div>
<div class="abs cta"><b>Learn More</b><span>+91 79935 44699</span></div>
</div></body></html>
